name: "Log Analyzer Add-on"
description: "A daily log analyzing addon"
version: "1.0.1"
slug: "log_analyzer_addon"
init: false
startup: services
boot: manual
hassio_api: true
homeassistant_api: true
hassio_role: manager
arch:
  - aarch64
  - amd64

schema:
  litellm_address: str
  litellm_api_key: password
  model_name: str
  advanced_settings:
    dry_run: bool
    run_on_start: bool
    single_run: bool
    scheduled_time: "match(^(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9])"
    token_count: int
    max_lines: int
    max_hours: int


options:
  litellm_address: "http://localhost:4000"
  model_name: "gpt-4o"
  advanced_settings:
    dry_run: false
    run_on_start: true
    single_run: true
    scheduled_time: "02:30"
    token_count: 4000
    max_lines: 10000
    max_hours: 24
